<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Transactions — AI Finance Assistant</title>
<link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>

<div class="app-shell">
  <nav class="sidebar">
    <div class="brand">Ledger<span>.</span></div>
    <div class="tagline">AI Finance Assistant</div>
    <div class="nav-links">
      <a href="dashboard.html">Dashboard</a>
      <a href="transactions.html" class="active">Transactions</a>
      <a href="budgets.html">Budgets</a>
      <a href="insights.html">Insights</a>
      <a href="chatbot.html">Chatbot</a>
    </div>
    <div class="sidebar-footer">
      <span class="user-name" id="sidebar-user">—</span>
      <a href="#" id="logout-link">Sign out</a>
    </div>
  </nav>

  <main class="main">
    <div class="page-header">
      <h1>Transactions</h1>
      <div class="sub">Log income and expenses. Leave the category blank on an expense and the AI model will suggest one.</div>
    </div>

    <form class="tx-form" id="tx-form">
      <div class="field">
        <label for="tx-date">Date</label>
        <input type="date" id="tx-date" required />
      </div>
      <div class="field" style="grid-column: span 2;">
        <label for="tx-description">Description</label>
        <input type="text" id="tx-description" placeholder="e.g. swiggy dinner 450" required />
      </div>
      <div class="field">
        <label for="tx-amount">Amount (₹)</label>
        <input type="number" id="tx-amount" min="0.01" step="0.01" required />
      </div>
      <div class="field">
        <label for="tx-type">Type</label>
        <select id="tx-type">
          <option value="expense">Expense</option>
          <option value="income">Income</option>
        </select>
      </div>
      <div class="field">
        <label for="tx-category">Category (optional)</label>
        <select id="tx-category">
          <option value="">Auto-detect</option>
          <option>Food</option>
          <option>Transport</option>
          <option>Shopping</option>
          <option>Bills</option>
          <option>Entertainment</option>
          <option>Health</option>
          <option>Education</option>
          <option>Other</option>
          <option>Salary</option>
        </select>
      </div>
      <button type="submit">Add</button>
    </form>

    <div class="tx-toolbar">
      <div class="field">
        <label for="filter-type">Type</label>
        <select id="filter-type">
          <option value="">All</option>
          <option value="income">Income</option>
          <option value="expense">Expense</option>
        </select>
      </div>
      <div class="field">
        <label for="filter-search">Search description</label>
        <input type="text" id="filter-search" placeholder="e.g. uber" />
      </div>
      <button type="button" class="btn-secondary" id="filter-apply">Apply filters</button>
    </div>

    <table class="ledger">
      <thead>
        <tr>
          <th>Date</th>
          <th>Description</th>
          <th>Category</th>
          <th style="text-align:right;">Amount</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="tx-table-body">
        <tr><td colspan="5" class="empty-note">Loading…</td></tr>
      </tbody>
    </table>
  </main>
</div>

<script src="assets/js/api.js"></script>
<script src="assets/js/nav.js"></script>
<script src="assets/js/transactions.js"></script>
</body>
</html>
