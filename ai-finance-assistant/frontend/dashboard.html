<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dashboard — AI Finance Assistant</title>
<link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>

<div class="app-shell">
  <nav class="sidebar">
    <div class="brand">Ledger<span>.</span></div>
    <div class="tagline">AI Finance Assistant</div>
    <div class="nav-links">
      <a href="dashboard.html" class="active">Dashboard</a>
      <a href="transactions.html">Transactions</a>
      <a href="budgets.html">Budgets</a>
      <a href="insights.html">Insights</a>
      <a href="chatbot.html">Chatbot</a>
    </div>
    <div class="sidebar-footer">
      <span class="user-name" id="sidebar-user">—</span>
      <a href="#" id="logout-link">Sign out</a>
    </div>
  </nav>

  <main class="main">
    <div class="page-header">
      <h1 id="greeting">Your finances</h1>
      <div class="sub">A snapshot of income, spending, and what's ahead.</div>
    </div>

    <div class="hero-row">
      <div class="hero-balance">
        <div class="label">Available balance</div>
        <div class="amount figure" id="balance-amount">—</div>
      </div>
      <div class="stat-pair">
        <div class="stat income">
          <div class="label">Total income</div>
          <div class="value figure" id="total-income">—</div>
        </div>
        <div class="stat expense">
          <div class="label">Total expenses</div>
          <div class="value figure" id="total-expense">—</div>
        </div>
      </div>
    </div>

    <hr class="rule" />

    <div class="two-col">
      <div>
        <div class="section-title">Spending by category</div>
        <div id="category-breakdown"><div class="empty-note">No expenses recorded yet.</div></div>
      </div>
      <div>
        <div class="section-title">Monthly trend</div>
        <canvas id="trend-chart" height="180"></canvas>
      </div>
    </div>

    <hr class="rule" />

    <div class="section-title">Next month's spending estimate</div>
    <div id="forecast-block">
      <div class="hero-balance">
        <div class="amount figure" id="forecast-amount" style="font-size:30px;">—</div>
      </div>
      <p class="empty-note" id="forecast-note" style="padding-top:0;"></p>
    </div>
  </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/nav.js"></script>
<script src="assets/js/dashboard.js"></script>
</body>
</html>
