<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI Finance Assistant — Sign in</title>
<link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>

<div class="auth-shell">
  <div class="auth-card">
    <div class="auth-mark">Ledger<span>.</span> <span>AI Finance Assistant</span></div>

    <div id="login-panel">
      <h1>Welcome back</h1>
      <p class="auth-sub">Sign in to see where your money went.</p>
      <div class="form-error" id="login-error"></div>
      <form id="login-form">
        <div class="field">
          <label for="login-email">Email</label>
          <input type="email" id="login-email" required autocomplete="email" />
        </div>
        <div class="field">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" required autocomplete="current-password" />
        </div>
        <button type="submit" style="width:100%">Sign in</button>
      </form>
      <p class="auth-toggle">New here? <a href="#" id="show-register">Create an account</a></p>
    </div>

    <div id="register-panel" class="hidden">
      <h1>Create your account</h1>
      <p class="auth-sub">Track spending and get AI-assisted insights in minutes.</p>
      <div class="form-error" id="register-error"></div>
      <form id="register-form">
        <div class="field">
          <label for="register-name">Full name</label>
          <input type="text" id="register-name" required />
        </div>
        <div class="field">
          <label for="register-email">Email</label>
          <input type="email" id="register-email" required autocomplete="email" />
        </div>
        <div class="field">
          <label for="register-password">Password</label>
          <input type="password" id="register-password" required minlength="6" autocomplete="new-password" />
        </div>
        <button type="submit" style="width:100%">Create account</button>
      </form>
      <p class="auth-toggle">Already have an account? <a href="#" id="show-login">Sign in</a></p>
    </div>

    <hr class="rule" />
    <p class="auth-sub" style="margin-bottom:0;">
      Educational project — not a substitute for professional financial advice.
    </p>
  </div>
</div>

<script src="assets/js/api.js"></script>
<script src="assets/js/auth.js"></script>
</body>
</html>
